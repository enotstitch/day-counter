<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link type="image/png" rel="shortcut icon" href="favicon/favicon.png">
  <link rel="stylesheet" href="node_modules/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="node_modules/flatpickr/dist/themes/dark.css">
  <link rel="stylesheet" href="css/main.css">
  <title>Day counter</title>
</head>

<body>
  <main class="main">
    <section class="day-counter">
      <div class="container">
        <h1 class="title">Расчёт времени до события</h1>
        <form class="day-counter__wrap">
          <input class="day-counter__date input input-reset" type="text" placeholder="Выбрать дату">
          <input class="day-counter__calculate input input-reset" type="submit" value="Рассчитать">
        </form>
        <div class="day-counter__result result">
          <div class="result__item result-item">
            <span class="result-item__num result-item__num--years">0</span>
            <span class="result-item__text result-item__text--years">Лет</span>
          </div>
          <div class="result__item result-item">
            <span class="result-item__num result-item__num--days">0</span>
            <span class="result-item__text result-item__text--days">Дней</span>
          </div>
          <div class="result__item result-item">
            <span class="result-item__num result-item__num--hours">0</span>
            <span class="result-item__text result-item__text--hours">Часов</span>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/main.js" type="module"></script>
</body>

</html>
